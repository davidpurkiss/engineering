name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate entries and specs
        run: npm run validate
      - name: Boundary checker fires on the fixtures
        run: npm run test:fixtures
      - name: Rebuild index and check it was committed
        run: |
          npm run index
          git diff --exit-code -- index/ \
            || { echo "::error::index/ is stale — run 'npm run index' and commit the result"; exit 1; }
