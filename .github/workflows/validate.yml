name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontmatter
        run: npm run validate
      - name: Rebuild index and check it was committed
        run: |
          npm run index
          git diff --exit-code -- index/ \
            || { echo "::error::index/ is stale — run 'npm run index' and commit the result"; exit 1; }
